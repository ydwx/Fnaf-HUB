<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FNAF Hub - Security Office</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1 id="mainTitle">مركز ألعاب فناف</h1>
    <div class="controls">
      <button id="themeToggle">💡</button>
      <button id="langToggle">🇬🇧 English</button>
    </div>
  </header>

  <!-- ===== القائمة الرئيسية ===== -->
  <section id="homePage">
    <div id="gamesContainer" class="games-grid"></div>
  </section>

  <!-- ===== صفحة التفاصيل ===== -->
  <section id="detailPage" style="display: none;">
    <button id="backBtn" class="back-btn">⬅ رجوع</button>
    <div id="detailContent"></div>
  </section>

  <!-- ===== نافذة اختيار التحميل (Modal) ===== -->
  <div id="downloadModal" class="modal" style="display:none;">
    <div class="modal-content">
      <span class="close-modal">✖</span>
      <h2 id="modalTitle">اختر نسخة التحميل</h2>
      <div id="modalButtons"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
