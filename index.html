<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FNAF Hub</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1 id="mainTitle">مركز ألعاب فناف</h1>
    <div class="controls">
      <button id="themeToggle">🌙</button>
      <button id="langToggle">🇬🇧 English</button>
    </div>
  </header>

  <!-- ===== شريط البحث والتصفية ===== -->
  <div class="filter-bar">
    <input type="text" id="searchInput" placeholder="🔍 ابحث عن لعبة..." />
    <div class="filter-buttons">
      <button class="filter-btn active" data-filter="all">الكل</button>
      <button class="filter-btn" data-filter="MOD">🔴 MOD</button>
      <button class="filter-btn" data-filter="PORT">🟣 PORT</button>
      <button class="filter-btn" data-filter="ORIGINAL">🟡 ORIGINAL</button>
    </div>
  </div>

  <!-- ===== القائمة الرئيسية ===== -->
  <section id="homePage">
    <div id="gamesContainer" class="games-grid"></div>
  </section>

  <!-- ===== صفحة التفاصيل ===== -->
  <section id="detailPage" style="display: none;">
    <button id="backBtn" class="back-btn">↩ رجوع</button>
    <div id="detailContent"></div>
  </section>

  <script src="script.js"></script>
</body>
</html>
